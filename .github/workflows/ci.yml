name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.project }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: functions
            working_directory: functions
            lockfile: functions/package-lock.json
            node_version: '24'
          - project: web
            working_directory: web
            lockfile: web/package-lock.json
            node_version: '24'

    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  status-checks:
    name: status-checks
    if: always()
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Validate matrix result
        run: |
          echo "quality result: ${{ needs.quality.result }}"
          test "${{ needs.quality.result }}" = "success"
